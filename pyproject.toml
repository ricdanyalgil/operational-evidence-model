[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oem-evidence"
version = "0.1.0"
description = "Operational Evidence Model: validate, justify and anchor operational data before it becomes evidence. Doctoral research, University of Minho."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Ricardo Danyalgil Junior" }]
dependencies = ["cryptography>=42"]
keywords = ["provenance", "evidence", "blockchain", "auditability", "PROV-O", "AI Act", "IoT"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
oem = "oem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
